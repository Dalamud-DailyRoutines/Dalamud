name: Build Dalamud
on: workflow_dispatch
concurrency:
  group: build_dalamud_${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Windows
    timeout-minutes: 45
    permissions:
      contents: write
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.generate-tag.outputs.new_tag }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
      CONFIGURATION: Release
    steps:
      - name: Checkout Dalamud
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release tag (UTC+8)
        id: generate-tag
        run: |
          $tzId = "China Standard Time"
          $utcNow = [DateTime]::UtcNow
          $cstTime = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId($utcNow, $tzId)

          # 以东八区时间生成形如 yy-MM-dd-xx 的标签
          $datePart = $cstTime.ToString("yy-MM-dd")

          # checkout 已拉取完整历史与标签，这里直接读取本地标签
          $tags = git tag --list "$datePart-*"

          # 查找当天已有标签的最大序号
          $maxNumber = 0
          foreach ($tag in $tags) {
            $numberPart = $tag.Split('-')[-1]
            if ($numberPart -match '^\d{2}$') {
              $currentNumber = [int]$numberPart
              $maxNumber = [Math]::Max($maxNumber, $currentNumber)
            }
          }

          # 递增序号并写入输出变量
          $nextNumber = $maxNumber + 1
          $newTag = "{0}-{1:D2}" -f $datePart, $nextNumber
          echo "new_tag=$newTag" >> $env:GITHUB_OUTPUT
          echo "TAG=$newTag" >> $env:GITHUB_ENV

      - name: Create and Push Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.TAG }}" -m "Release ${{ env.TAG }}"
          git push origin "${{ env.TAG }}"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.100"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install CMake
        env:
          CMAKE_VERSION: "4.2.0"
        run: |
          $name = "cmake-$env:CMAKE_VERSION-windows-x86_64"
          $url = "https://cmake.org/files/v$($env:CMAKE_VERSION -replace '\.\d+$', '')"
          Invoke-WebRequest "$url/$name.zip" -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Invoke-WebRequest "$url/cmake-$env:CMAKE_VERSION-SHA-256.txt" -OutFile "$env:RUNNER_TEMP\cmake.sha256"

          $expected = (Select-String -Path "$env:RUNNER_TEMP\cmake.sha256" -Pattern "  $name.zip$").Line.Split(' ')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP\cmake.zip" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "CMake checksum mismatch: $actual != $expected" }

          Expand-Archive "$env:RUNNER_TEMP\cmake.zip" $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$name\bin" >> $env:GITHUB_PATH

      - name: Define VERSION
        run: |
          # VERSION 文件包含仓库名、分支名、短提交哈希与发布标签
          $env:TAG = "${{ env.TAG }}"
          $env:COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          $env:REPO_NAME = $env:GITHUB_REPOSITORY -replace '.*/'
          $env:BRANCH = $env:GITHUB_REF -replace '.*/'

          @(
            $env:REPO_NAME
            $env:BRANCH
            $env:COMMIT
            $env:TAG
          ) | Set-Content -LiteralPath VERSION -Encoding utf8

      - name: Build Dalamud
        run: .\build.cmd $env:CONFIGURATION

      - name: Test Dalamud
        run: dotnet test .\Dalamud.Test\Dalamud.Test.csproj -c $env:CONFIGURATION -p:WarningLevel=0

      - name: Create hashlist
        run: .\tools\create_hashlist.ps1 .\bin\Release

      - name: Install 7-Zip
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          } else {
            Write-Host "7-Zip 已安装，跳过安装步骤。"
          }

      - name: Compress Release files
        run: |
          # 仅压缩 Release 目录内容，避免携带上级目录结构
          Push-Location -LiteralPath .\bin\Release
          try {
            7z a -t7z latest.7z * -mx=9
          } finally {
            Pop-Location
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = @"
          Automated Release
          Build Date: ${{ env.TAG }} (UTC+8)
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          "@

          $assets = @(
            "bin/Release/latest.7z"
            "bin/Release/hashes.json"
          )

          gh release create "${{ env.TAG }}" `
            @assets `
            --title "Release ${{ env.TAG }}" `
            --notes $releaseNotes `
            --verify-tag

  upload-r2:
    name: Upload to R2
    needs: build
    uses: ./.github/workflows/r2-upload.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
